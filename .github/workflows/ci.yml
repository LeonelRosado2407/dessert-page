name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Sin --fix: en CI el lint debe fallar en vez de corregir
      - name: Lint
        run: npx oxlint . && npx eslint .

      - name: Type-check
        run: npm run type-check

      - name: Tests unitarios
        run: npx vitest run

      - name: Build
        run: npm run build-only

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      # Con CI=true, Playwright levanta `vite preview` sobre el build
      - name: Tests end-to-end
        run: npx playwright test --project=chromium

      - name: Subir reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
